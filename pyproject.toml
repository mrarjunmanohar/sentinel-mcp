[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopify-sentinel"
version = "0.9.0"
description = "Self-contained Shopify insight and anomaly-detection intelligence layer — a local MCP server for Claude Desktop"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Elastic License 2.0" }
dependencies = [
    "pydantic>=2.0",
    "mcp>=1.2",
]

[project.scripts]
sentinel = "sentinel.main:main"
sentinel-mcp = "sentinel.mcp_server:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]
exclude = ["sentinel.tests*"]
